[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sports-prediction-model"
version = "0.1.0"
description = "Multi-sport (NBA/WNBA/MLB/NFL/NHL/soccer/NASCAR) game-winner and player-prop model training and feature engineering code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "catboost>=1.2.0",
    "scikit-learn>=1.6.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "optuna>=4.1.0",
    "mlflow>=2.19.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
